AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  zt-radar
  Serverless Discord Bot for Game Deals & Price Tracking

Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Runtime: nodejs22.x
    Architectures:
      - arm64

Parameters:
  DiscordPublicKey:
    Type: String
    Description: Discord Application Public Key for Ed25519 signature verification
  DiscordBotToken:
    Type: String
    NoEcho: true
    Description: Discord Bot Token for REST API calls
  DiscordAppId:
    Type: String
    Description: Discord Application ID
  ItadApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: IsThereAnyDeal API Key (Optional)
  SteamApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Valve Steam Web API Key (Optional)
  AuthCallbackUrl:
    Type: String
    Default: ""
    Description: Public HTTPS URL for the Steam OpenID callback route (e.g. https://<api-id>.execute-api.<region>.amazonaws.com/prod/auth/steam/callback)

Resources:
  # HTTP API Gateway with Rate Limiting & Throttling Protection
  DiscordApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # DynamoDB Table (Single-Table Design)
  DealsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Interactions Webhook Handler
  DiscordBotFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node22"
        Sourcemap: true
        EntryPoints:
          - src/handlers/discordBot.js
    Properties:
      CodeUri: .
      Handler: src/handlers/discordBot.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref DealsTable
          DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
          DISCORD_BOT_TOKEN: !Ref DiscordBotToken
          DISCORD_APP_ID: !Ref DiscordAppId
          ITAD_API_KEY: !Ref ItadApiKey
          STEAM_API_KEY: !Ref SteamApiKey
          AUTH_CALLBACK_URL: !Ref AuthCallbackUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DealsTable
      Events:
        DiscordInteraction:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscordApi
            Path: /interactions
            Method: post
        SteamAuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscordApi
            Path: /auth/steam/login
            Method: get
        SteamAuthCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref DiscordApi
            Path: /auth/steam/callback
            Method: get

  # Scheduled Market Deal Scanner
  DealScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node22"
        Sourcemap: true
        EntryPoints:
          - src/handlers/dealScanner.js
    Properties:
      CodeUri: .
      Handler: src/handlers/dealScanner.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref DealsTable
          DISCORD_BOT_TOKEN: !Ref DiscordBotToken
          ITAD_API_KEY: !Ref ItadApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DealsTable
      Events:
        HourlyScan:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Scans market deals and monitored wishlists hourly

Outputs:
  InteractionsEndpoint:
    Description: "Discord Interactions Endpoint URL to paste in Discord Developer Portal"
    Value: !Sub "https://${DiscordApi}.execute-api.${AWS::Region}.amazonaws.com/prod/interactions"