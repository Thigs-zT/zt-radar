AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  zt-radar
  Serverless Game Deal Intelligence Discord Bot on AWS

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref ZtRadarTable
        DISCORD_APP_ID: !Ref DiscordAppId
        DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
        DISCORD_BOT_TOKEN: !Ref DiscordBotToken
        ITAD_API_KEY: !Ref ItadApiKey

Parameters:
  DiscordAppId:
    Type: String
    Description: Discord Application Client ID
  DiscordPublicKey:
    Type: String
    Description: Discord Application Public Key (Ed25519)
  DiscordBotToken:
    Type: String
    Description: Discord Bot Authentication Token
    NoEcho: true
  ItadApiKey:
    Type: String
    Description: IsThereAnyDeal v3 API Key
    NoEcho: true

Resources:
  ZtRadarTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: zt-radar-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  DiscordBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/discordBot.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ZtRadarTable
      Events:
        DiscordWebhook:
          Type: HttpApi
          Properties:
            Path: /interactions
            Method: post

  DealScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/dealScanner.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ZtRadarTable
      Events:
        ScanSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

Outputs:
  InteractionsWebhookUrl:
    Description: HTTP API Endpoint for Discord Interactions Webhook
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/interactions"
  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref ZtRadarTable