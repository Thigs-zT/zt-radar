AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: zT Radar - Serverless Game Deal Intelligence and Discord Bot Infrastructure

Globals:
  Function:
    Timeout: 15
    MemorySize: 128
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref ZtRadarTable
        DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
        DISCORD_APP_ID: !Ref DiscordAppId
        DISCORD_BOT_TOKEN: !Ref DiscordBotToken
        ITAD_API_KEY: !Ref ItadApiKey

Parameters:
  DiscordPublicKey:
    Type: String
    Description: Public Key from Discord Developer Portal for request verification
  DiscordAppId:
    Type: String
    Description: Application Client ID from Discord Developer Portal
  DiscordBotToken:
    Type: String
    NoEcho: true
    Description: Bot Token from Discord Developer Portal
  ItadApiKey:
    Type: String
    NoEcho: true
    Description: API Key for IsThereAnyDeal v3

Resources:
  # DynamoDB Table - Single-Table Design
  ZtRadarTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: zt-radar-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # HTTP API Gateway for Discord Webhook Interactions
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: zt-radar-api

  # Lambda Handler: Reactive Discord Interactions (/wishlist)
  DiscordBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: zt-radar-bot-handler
      CodeUri: ./
      Handler: src/handlers/discordBot.handler
      Events:
        DiscordApi:
          Type: HttpApi
          Properties:
            Path: /discord
            Method: post
            ApiId: !Ref HttpApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ZtRadarTable

  # Lambda Handler: Scheduled Market Intelligence Scanner
  DealScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: zt-radar-deal-scanner
      CodeUri: ./
      Handler: src/handlers/dealScanner.handler
      Events:
        ScheduledScan:
          Type: Schedule
          Properties:
            Schedule: cron(0 12,21 * * ? *) # Runs twice a day at 12:00 UTC and 21:00 UTC
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ZtRadarTable

Outputs:
  DiscordEndpointUrl:
    Description: Endpoint URL to set as Interactivity Endpoint URL in Discord Developer Portal
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/discord"
  TableName:
    Description: DynamoDB Table Name
    Value: !Ref ZtRadarTable